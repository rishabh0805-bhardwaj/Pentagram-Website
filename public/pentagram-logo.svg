    <rect x="198" y="125" width="4" height="46" rx="2"/>
    <ellipse cx="200" cy="173" rx="10" ry="3"/>

    <!-- Armchair -->
    <path d="M 136 125 C 136 118, 157 118, 159 125 L 159 150 C 159 153, 156 155, 150 155 L 136 155 Z"/>
    <rect x="148" y="138" width="32" height="12" rx="6"/>
    <path d="M 176 138 C 182 138, 185 143, 185 150 L 185 174 C 185 178, 178 180, 174 178 L 174 152 C 174 143, 176 138, 176 138 Z"/>
    <rect x="152" y="165" width="5" height="12" rx="1.5"/>
  </g>

  <!-- Typography matching uploaded logo -->
  <text x="200" y="270" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#383838" letter-spacing="4">PENTAGRAM</text>
  <text x="200" y="296" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6B6565" letter-spacing="5">YOUR HOME EXPERT</text>
</svg>
