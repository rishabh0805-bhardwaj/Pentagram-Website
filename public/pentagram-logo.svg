  <circle cx="200" cy="180" r="140" stroke="#C7244E" stroke-width="3.5" stroke-dasharray="780 90" stroke-dashoffset="180" stroke-linecap="round" opacity="0.85"/>
  <circle cx="200" cy="180" r="132" stroke="#C7244E" stroke-width="2" stroke-dasharray="680 120" stroke-dashoffset="360" stroke-linecap="round" opacity="0.6"/>

  <!-- Crimson Pentagon -->
  <path d="M 200 86 L 260 125 L 241 196 L 159 196 L 140 125 Z" fill="#C7244E"/>

